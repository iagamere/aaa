name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find . -path "*/outputs/apk/*/debug/*.apk" -o -path "*/outputs/apk/debug/*.apk" 2>/dev/null | head -1)
          echo "Found APK: $APK"
          test -n "$APK" || { echo "ERROR: No APK found"; find . -name "*.apk" 2>/dev/null; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -la "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app-debug.apk
          generate_release_notes: true
